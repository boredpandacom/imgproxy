# Builds the imgproxy image from this repo's Dockerfile for linux/amd64 and
# linux/arm64, pushes it to the `imgproxy` ECR repository (created by
# boredpanda-vibe's Terraform) as one multi-architecture image, and triggers a
# rolling redeploy of the imgproxy ECS services.
#
# Each architecture builds natively on its own runner (cgo + libvips under
# QEMU emulation would take far longer). The ECS task definition's
# runtime_platform (imgproxy_cpu_architecture in boredpanda-vibe) picks which
# variant Fargate pulls.
#
# Required repo secret:
#   AWS_ROLE_ARN = <output imgproxy_ci_role_arn from terraform>
name: Build & Deploy imgproxy

on:
  push:
    branches: [master]
  workflow_dispatch:

env:
  AWS_REGION: us-east-1
  ECR_REPOSITORY: imgproxy
  ECS_CLUSTER: boredpanda

permissions:
  id-token: write # required for OIDC
  contents: read

jobs:
  build:
    name: Build & push (${{ matrix.arch }})
    strategy:
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-latest
          - arch: arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Login to ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build and push
        env:
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          IMAGE_TAG: ${{ github.sha }}-${{ matrix.arch }}
          CACHE_TAG: latest-${{ matrix.arch }}
        run: |
          docker build \
            -f docker/Dockerfile \
            --platform "linux/${{ matrix.arch }}" \
            --cache-from "$ECR_REGISTRY/$ECR_REPOSITORY:$CACHE_TAG" \
            --tag "$ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG" \
            --tag "$ECR_REGISTRY/$ECR_REPOSITORY:$CACHE_TAG" \
            .
          docker push "$ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG"
          docker push "$ECR_REGISTRY/$ECR_REPOSITORY:$CACHE_TAG"

  # Joins the per-architecture images into one multi-architecture tag.
  manifest:
    name: Publish multi-arch image
    needs: build
    runs-on: ubuntu-latest
    outputs:
      image: ${{ steps.manifest.outputs.image }}
    steps:
      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Login to ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Create and push manifest
        id: manifest
        env:
          REPO: ${{ steps.login-ecr.outputs.registry }}/${{ env.ECR_REPOSITORY }}
          SHA: ${{ github.sha }}
        run: |
          docker buildx imagetools create \
            --tag "$REPO:$SHA" \
            --tag "$REPO:latest" \
            "$REPO:$SHA-amd64" \
            "$REPO:$SHA-arm64"
          docker buildx imagetools inspect "$REPO:latest"
          echo "image=$REPO:$SHA" >> "$GITHUB_OUTPUT"

  # The ECS task definitions pin the :latest tag and Terraform ignores
  # task_definition changes, so a force-new-deployment is what actually ships a
  # freshly pushed image. Both envs run the same env-agnostic binary.
  deploy:
    name: Redeploy (${{ matrix.env }})
    needs: manifest
    runs-on: ubuntu-latest
    strategy:
      matrix:
        env: [staging, production]
    steps:
      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Force new deployment
        run: |
          aws ecs update-service \
            --cluster "$ECS_CLUSTER" \
            --service "imgproxy-${{ matrix.env }}" \
            --force-new-deployment \
            --query 'service.serviceName' --output text
